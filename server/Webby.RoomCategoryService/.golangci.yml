version: 2

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - lll
    - revive
    - misspell

linters-settings:
  lll:
    line-length: 110
  goimports:
    local-prefixes: webby
  revive:
    enable-default-rules: true
    ignore-generated-header: true
    severity: warning
    rules:
      - name: package-comments
        disabled: true
      - name: exported
        disabled: true
      - name: context-keys-type
        disabled: true
      - name: var-naming
        disabled: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules: []
