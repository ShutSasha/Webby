  /api/rooms/{id}/votes/{voteId}/cast:
    post:
      description: |
        Cast a vote for a specific choice. Each user can only vote **once** per vote.

        **Request Body Validation:**
        * `choiceId`: **required**, must be a valid UUID v4 format (choice ID)

        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format (room ID)
        * `voteId`: must be a valid UUID v4 format (vote ID)

        **Business Rules:**
        * The vote must be **active** (not expired) to accept votes
        * A user who has already voted will receive a **409 Conflict** response
        * Returns updated vote details with recalculated percentages

        **Access Rules:**
        * Only **room members** can cast votes

        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Vote ID (UUID v4 format)
        in: path
        name: voteId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteApiResponse'
          description: Vote cast successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Invalid input: bad UUID format or vote has expired"
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied - only room members can cast votes
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Vote or choice not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: "Conflict: user has already voted on this vote"
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Cast a vote
      tags:
      - Votes
    delete:
      description: |
        Remove the current user's vote from an active vote (unvote).

        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format (room ID)
        * `voteId`: must be a valid UUID v4 format (vote ID)

        **Business Rules:**
        * The vote must be **active** (not expired) to allow unvoting
        * The user must have **previously voted** on this vote
        * Returns updated vote details with recalculated percentages

        **Access Rules:**
        * Only **room members** can remove their votes

        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Vote ID (UUID v4 format)
        in: path
        name: voteId
        required: true
        schema:
          type: string
      responses:
