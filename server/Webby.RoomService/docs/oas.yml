info:
  description: This API provides endpoints for managing rooms and categories.
  title: Webby.RoomService
  version: "1.0"
openapi: 3.0.0
paths:
  /api/categories:
    get:
      description: ' Retrieve a paginated list of room categories. Supports optional
        search by name.'
      parameters:
      - description: Search categories by name
        in: query
        name: search
        schema:
          description: Search categories by name
          type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        schema:
          description: 'Page number (default: 1)'
          format: int64
          type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        schema:
          description: 'Items per page (default: 10, max: 100)'
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListApiResponse'
          description: Categories successfully retrieved
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: List categories
      tags:
      - RoomCategory
    post:
      description: ' Create a new room category. Name is required (2-50 chars, unique).
        Only administrators can perform this action.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryApiResponse'
          description: Category successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid input data
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized - Admin role required
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'Conflict: Category name already exists'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create a new category
      tags:
      - RoomCategory
  /api/categories/{id}:
    delete:
      description: ' Delete a room category by ID. Permanent action. Only administrators
        can perform this action.'
      parameters:
      - description: Category ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Category ID (UUID v4 format)
          type: string
      responses:
        "204":
          description: Category successfully deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized - Admin role required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Category not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete a category
      tags:
      - RoomCategory
    put:
      description: ' Update an existing room category by ID. Only the name field is
        updateable. Only administrators can perform this action.'
      parameters:
      - description: Category ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Category ID (UUID v4 format)
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryApiResponse'
          description: Category successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid input
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized - Admin role required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Category not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update a category
      tags:
      - RoomCategory
  /api/rooms:
    post:
      description: ' Create a new room with a name, category ID, privacy setting,
        and optional thumbnail.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                categoryId:
                  description: Category ID (UUID v4, required)
                  type: string
                isPrivate:
                  description: 'Visibility flag: ''true'' or ''false'''
                  type: string
                name:
                  description: Room name (2-50 chars, required, non-whitespace)
                  type: string
                thumbnail:
                  description: Room thumbnail image (optional, max 2MB)
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomApiResponse'
          description: Room successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid input
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create a new room
      tags:
      - Rooms
  /api/rooms/{id}:
    delete:
      description: ' Delete a room by ID. Permanent action - cannot be undone. Only
        the authorized room creator can delete.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      responses:
        "204":
          description: Room successfully deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete a room
      tags:
      - Rooms
    get:
      description: ' Retrieve a room by its ID. Only the room creator (host) can retrieve
        the room by ID.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomApiResponse'
          description: Room successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get a room by ID
      tags:
      - Rooms
    put:
      description: ' Update a room''s name, category ID, privacy setting, and thumbnail
        by ID. Only the authorized room creator can update.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                categoryId:
                  description: Category ID (UUID v4, required)
                  type: string
                isPrivate:
                  description: Visibility flag ('true' or 'false', required)
                  type: string
                name:
                  description: Room name (2-50 chars, required)
                  type: string
                thumbnail:
                  description: New thumbnail image (optional, max 2MB)
                  format: binary
                  type: string
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomApiResponse'
          description: Room successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid input
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update a room
      tags:
      - Rooms
  /api/rooms/{id}/members:
    get:
      description: ' Retrieve a paginated list of members for a specific room. Supports
        optional search by username.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        schema:
          description: 'Page number (default: 1)'
          format: int64
          type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        schema:
          description: 'Items per page (default: 10, max: 100)'
          format: int64
          type: integer
      - description: Search members by username (case-insensitive)
        in: query
        name: search
        schema:
          description: Search members by username (case-insensitive)
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListApiResponse'
          description: Room members successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid UUID format or query parameters
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: List room members
      tags:
      - Rooms
  /api/rooms/{id}/members/{memberId}:
    delete:
      description: ' Remove a user from a room''s member list. Only the room host
        can remove members. The host cannot remove themselves.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      - description: Member User ID (UUID v4 format)
        in: path
        name: memberId
        required: true
        schema:
          description: Member User ID (UUID v4 format)
          type: string
      responses:
        "204":
          description: Member successfully removed
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid UUID format
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authorized - only host can remove members
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Room or member not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Remove a member from a room
      tags:
      - Rooms
  /api/rooms/{id}/queue:
    get:
      description: ' Retrieve the playback queue for a room with enriched media data.
        Pagination is based on individual videos. Only room members can view the queue.'
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          description: Room ID (UUID v4 format)
          type: string
      - description: 'Page number (default: 1)'
        in: query
