        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Access denied - only room members can remove from queue
        "404":
          content:
            application/json:
              schema:
