        * ONLY A SEPARATE VIDEO OR THE PLAYLIST ITSELF CAN BE DELETED, THE VIDEO FROM THE PLAYLIST CAN NOT BE DELETED SEPARATELY**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Queue Item ID (UUID v4 format)
        in: path
        name: itemId
        required: true
        schema:
          type: string
