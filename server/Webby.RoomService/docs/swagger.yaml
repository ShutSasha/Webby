externalDocs:
  description: ""
  url: ""
info:
  description: This API provides endpoints for managing rooms and categories.
  title: Webby.RoomService
  version: "1.0"
openapi: 3.0.3
paths:
  /categories:
    get:
      description: |-
        Retrieve a **paginated** list of room categories. Supports optional **search** by name.
        **Query Parameters Fallback:**
        * Invalid, missing, or non-numeric `page` values will default to **1**.
        * Invalid, missing, or non-numeric `limit` values (<1) will default to **10**. Limits >100 are capped at **100**.
        * `search`: optional string to filter categories by name (case-insensitive)
      parameters:
      - description: Search categories by name (optional)
        in: query
        name: search
        schema:
          type: string
      - description: Page number (defaults to 1 if invalid)
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Items per page (defaults to 10 if invalid, max 100)
        in: query
        name: limit
        schema:
          default: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_PaginatedResponse-docs_CategoryResponse'
          description: Successful retrieval with pagination metadata
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      summary: List categories
      tags:
      - RoomCategory
    post:
      description: |-
        Create a new room category for organizing rooms.
        **Validation Rules:**
        * Name is **required** (cannot be null, empty, or whitespace-only)
        * Name length must be **2-50 characters**
        * Category name must be **unique** (409 Conflict if already exists)
        **Security Note:**
        * **ONLY ADMINISTRATORS** are authorized to perform this action.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/docs.CreateCategoryRequest'
                description: '**Category data.** Name (2-50 chars, required, unique)'
                summary: request
        description: '**Category data.** Name (2-50 chars, required, unique)'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_CategoryResponse'
          description: Category successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: 'Invalid input data: name missing, empty, too short (<2), too
            long (>50), or whitespace-only. Also: malformed JSON, wrong Content-Type'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Not authorized - Admin role required
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error409Response'
          description: 'Conflict: Category name already exists'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Create a new category
      tags:
      - RoomCategory
  /categories/{id}:
    delete:
      description: |-
        Delete a room category by ID. **Permanent action - cannot be undone.**
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * **ONLY ADMINISTRATORS** are authorized to perform this action.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Category successfully deleted - No Content returned
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Not authorized - Admin role required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Category not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - RoomCategory
    put:
      description: |-
        Update an existing room category by ID. Only the **name** field is updateable.
        **Validation Rules:**
        * Name is **required** (cannot be null, empty, or whitespace-only)
        * Name length must be **2-50 characters**
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * **ONLY ADMINISTRATORS** are authorized to perform this action.
      parameters:
      - description: Category ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/docs.UpdateCategoryRequest'
                description: Category update data - Name (2-50 chars, required, non-whitespace)
                summary: request
        description: Category update data - Name (2-50 chars, required, non-whitespace)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_CategoryResponse'
          description: Category successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: 'Invalid input: name missing, empty, too short (<2), too long
            (>50), whitespace-only, invalid UUID in path, or malformed JSON'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Not authorized - Admin role required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Category not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update a category
      tags:
      - RoomCategory
  /rooms:
    post:
      description: |-
        Create a new room with a name, **category ID**, privacy setting, and optional **thumbnail**.
        **Validation Rules:**
        * `name`: **required**, 2-50 characters, cannot be null/empty/whitespace-only
        * `categoryId`: **required**, must be a valid UUID v4 format
        * `isPrivate`: **required**, must be valid boolean ("true" or "false")
        * `thumbnail`: optional file upload, max 2MB
        **Security Note:**
        * This action **requires authentication**
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - maxLength: 50
                minLength: 2
                title: name
                type: string
              - format: uuid
                title: categoryId
                type: string
              - title: isPrivate
                type: string
              - title: thumbnail
                type: file
          multipart/form-data:
            schema:
              type: object
        description: 'Room name (2-50 chars, required, non-whitespace) | Category
          ID (required) | Visibility flag (required): ''true'' or ''false'' | Room
          thumbnail image (optional, max 2MB)'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_RoomResponse'
          description: Room successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: 'Invalid input: name empty/too short/too long, invalid categoryId
            UUID, invalid isPrivate boolean, file too large or missing required fields'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Create a new room
      tags:
      - Rooms
  /rooms/{id}:
    delete:
      description: |-
        Delete a room by ID. **Permanent action - cannot be undone.**
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * This action **requires authentication**
        * **Only the authorized room creator** can delete this room
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Room successfully deleted - No Content returned
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Not authorized - only creator or admin can delete
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Delete a room
      tags:
      - Rooms
    get:
      description: |-
        Retrieve a room by its ID.
        **Access Rules:**
        * Only the **room creator (host)** can retrieve the room by ID
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_RoomResponse'
          description: Room successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid UUID format in path
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Access denied - only the room creator can retrieve
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get a room by ID
      tags:
      - Rooms
    put:
      description: |-
        Update a room's name, **category ID**, privacy setting, and **thumbnail** by ID.
        **Validation Rules:**
        * `name`: **required**, 2-50 characters, cannot be null/empty/whitespace-only
        * `categoryId`: **required**, must be a valid UUID v4 format
        * `isPrivate`: **required**, must be valid boolean ("true" or "false")
        * `thumbnail`: optional file upload, max 2MB
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * This action **requires authentication**
        * **Only the authorized room creator** can update this room
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - maxLength: 50
                minLength: 2
                title: name
                type: string
              - format: uuid
                title: categoryId
                type: string
              - title: isPrivate
                type: string
              - title: thumbnail
                type: file
          multipart/form-data:
            schema:
              type: object
        description: Room name (2-50 chars, required) | Category ID (UUID v4, required)
          | Visibility flag ('true' or 'false', required) | New thumbnail image (optional,
          max 2MB)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_RoomResponse'
          description: Room successfully updated
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: 'Invalid input: name validation failed, invalid UUID, invalid
            boolean, file too large, or missing required fields'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Not authorized - only creator or admin can update
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Room not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update a room
      tags:
      - Rooms
  /rooms/{id}/members:
    get:
      description: |-
        Retrieve a paginated list of members for a specific room.
        **Query Parameter Validation:**
        * `page`: **optional** (default: 1), must be >= 1, must be numeric
        * `limit`: **optional** (default: 10), must be 1-100, must be numeric
        * `search`: **optional**, filters members by username (case-insensitive partial match)
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format
        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        schema:
          minimum: 1
          type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: Search members by username (optional, case-insensitive)
        in: query
        name: search
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-PaginatedResponse[RoomMemberItem]'
          description: Room members successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid UUID format or query parameters
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: List room members
      tags:
      - Rooms
  /rooms/{id}/queue:
    get:
      description: |-
        Retrieve the playback queue for a room with enriched media data.
        Pagination is based on individual videos: standalone videos count as 1, each video inside a playlist counts as 1.
        Playlists are returned with their `children` truncated to the videos that fall within the current page.
        **Query Parameter Validation:**
        * `page`: **optional** (default: 1), must be >= 1, must be numeric
        * `limit`: **optional** (default: 10), must be 1-100, must be numeric
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format (room ID)
        **Access Rules:**
        * Only **room members** can view the queue
        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        schema:
          minimum: 1
          type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        schema:
          maximum: 100
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_PaginatedResponse-docs_QueueItemDetailResponse'
          description: Queue successfully retrieved
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid UUID format or invalid query parameters
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Access denied - only room members can view the queue
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get room queue
      tags:
      - Room Queue
    post:
      description: |-
        Add a video or playlist to the room's playback queue.
        **Request Body Validation:**
        * `entityId`: **required**, must be a valid UUID v4 format
        * `entityType`: **required**, must be either "video" or "playlist"
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format (room ID)
        **Access Rules:**
        * Only **room members** can add items to the queue
        **Security Note:**
        * This action **requires authentication**
      parameters:
      - description: Room ID (UUID v4 format)
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/docs.AddQueueItemRequest'
                description: Queue item to add
                summary: body
        description: Queue item to add
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.ApiResponse-docs_QueueItemResponse'
          description: Item successfully added to queue
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error400Response'
          description: Invalid input (bad UUID, invalid entityType)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error401Response'
          description: Missing or invalid authentication token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error403Response'
          description: Access denied - only room members can add to queue
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error404Response'
          description: Room or entity not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docs.Error500Response'
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Add item to room queue
      tags:
      - Room Queue
  /rooms/{id}/queue/{itemId}:
    delete:
      description: |-
        Remove a video or playlist from the room's playback queue.
        **Path Parameter Validation:**
        * `id`: must be a valid UUID v4 format (room ID)
        * `itemId`: must be a valid UUID v4 format (queue item ID)
        **Access Rules:**
        * Only **room members** can remove items from the queue
        **Security Note:**
        * This action **requires authentication**
