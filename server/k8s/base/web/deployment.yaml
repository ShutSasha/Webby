apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: web
          image: eu-frankfurt-1.ocir.io/fr3wma7oqvij/webby-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: webby-secrets
                  key: ServerUrl
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: webby-secrets
                  key: WebAuthSecret
            - name: AUTH_GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: webby-secrets
                  key: WebAuthGoogleId
            - name: AUTH_GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: webby-secrets
                  key: WebGoogleAuthSecret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10