apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: webby-secrets
  namespace: default
spec:
  infisicalAuthRef:
    name: infisical-universal-auth
    namespace: default
    
  syncOptions:
    refreshInterval: 60s

  sources:
    - projectId: "YOUR-VAULT-PROJECT-ID" 
      environmentSlug: "prod"
      secretPath: "/"

  targets:
    - name: webby-secrets
      namespace: default
      kind: Secret
      creationPolicy: Orphan