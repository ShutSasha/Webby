<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification</title>
</head>
<body style="margin:0;padding:0;background-color:#111111;font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <table width="480" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#1b1b1b;border-radius:12px;padding:40px 24px;text-align:center;">

                <tr>
                    <td style="padding-bottom:24px;">
                        <img src="https://mydevhubimagebucket.s3.eu-west-3.amazonaws.com/webby-logo.png"
                             width="50" height="50"
                             style="display:block;margin:0 auto;border-radius:8px;" alt="logo">
                    </td>
                </tr>

                <tr>
                    <td style="color:#ffffff;font-size:22px;font-weight:700;padding-bottom:12px;">
                        Webby Account verification
                    </td>
                </tr>

                <tr>
                    <td style="color:#ffffff;font-size:36px;font-weight:700;letter-spacing:4px;padding:8px 0 24px;">
                        {{code}}
                    </td>
                </tr>

                <tr>
                    <td style="color:#cccccc;font-size:14px;line-height:20px;padding-bottom:8px;">
                        Paste this verification code on the verification page.
                    </td>
                </tr>

                <tr>
                    <td style="color:#666666;font-size:12px;">
                        If it wasn’t you, just ignore this message.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
