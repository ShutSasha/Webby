version: "3"

tasks:
  run_auth_service:
    desc: "Run the C# AuthService"
    cmds:
      - |
        cd ./Webby.AuthService
        dotnet run -p:WarningLevel=0

  run_user_service:
    desc: "Run the C# UserService"
    cmds:
      - |
        cd ./Webby.UserService
        dotnet run -p:WarningLevel=0

  run_video_service:
    desc: "Run the C# VideoService"
    cmds:
      - |
        cd ./Webby.VideoService
        dotnet run -p:WarningLevel=0

  run_api_getaway:
    desc: "Run the api getaway"
    cmds:
      - |
        cd ./Webby.ApiGetaway
        dotnet run -p:WarningLevel=0

  run_room_service:
    desc: "Run the Go RoomService"
    cmds:
      - |
        cd ./Webby.RoomService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_room_category_service:
    desc: "Run the Go RoomCategoryService"
    cmds:
      - |
        cd ./Webby.RoomCategoryService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_chat_service:
    desc: "Run the Go ChatService"
    cmds:
      - |
        cd ./Webby.ChatService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_notification_service:
    desc: "Run the C# NotificationService"
    cmds:
      - |
        cd ./Webby.NotificationService
        dotnet run -p:WarningLevel=0

  run_vote_service:
    desc: "Run the Go VoteService"
    cmds:
      - |
        cd ./Webby.VotesService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_room_queue_service:
    desc: "Run the Go RoomQueueService"
    cmds:
      - |
        cd ./Webby.RoomQueueService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_achievement_service:
    desc: "Run the C# AchievementService"
    cmds:
      - |
        cd ./Webby.AchievementService
        dotnet run -p:WarningLevel=0

  run_ws_gateway:
    desc: "Run the Go WsGateway"
    cmds:
      - |
        cd ./Webby.WsGateway
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_admin_service:
    desc: "Run Admin Service"
    cmds:
      - |
        cd ./Webby.AdminService
        CGO_ENABLED=0 go build -o server.exe ./cmd/server/main.go
        ./server.exe --config ./config/config.yaml

  run_all:
    desc: "Run all services" 
    deps:
      - run_auth_service
      - run_api_getaway
      - run_ws_gateway
      - run_user_service
      - run_video_service
      - run_room_category_service
      - run_room_service
      - run_chat_service
      - run_notification_service
      - run_achievement_service
      - run_vote_service
      - run_room_queue_service
      - run_admin_service
