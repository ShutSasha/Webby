syntax = "proto3";

package room;

option go_package = "webby/admin-service/internal/grpc/roompb";

import "google/protobuf/empty.proto";

service RoomGrpcService {
  rpc GetTotalRooms(google.protobuf.Empty) returns (GetTotalRoomsResponse);
}

message GetTotalRoomsResponse {
  int32 totalRooms = 1;
}
