openapi: 3.0.3
info:
  title: Webby - Chat Service
  description: |
    The Chat Service manages chat creation and retrieval for Webby rooms.
    All endpoints require a valid JWT Bearer token.
  version: 1.0.0
  contact:
    name: Webby Platform Team
tags:
  - name: Chats
    description: Endpoints for managing chats
paths:
  /api/chats:
    post:
      tags:
        - Chats
      summary: Create a chat
      description: Create a new chat. If a room ID is provided, the service will reuse an existing chat for that room when available.
      operationId: createChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chats/{id}:
    get:
      tags:
        - Chats
      summary: Get chat by ID
      description: Retrieve a chat by UUID.
      operationId: getChatById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Chat identifier
      responses:
        '200':
          description: Chat retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateChatRequest:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
          nullable: true
          description: Optional room UUID to reuse an existing chat
    ChatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    ChatApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ChatResponse'
        errors:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
