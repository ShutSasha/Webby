openapi: 3.0.3
info:
  title: Webby - Chat Service
  description: |
    The Chat Service manages chat creation and retrieval for Webby rooms.
    All endpoints require a valid JWT Bearer token.
  version: 1.0.0
  contact:
    name: Webby Platform Team
tags:
  - name: Chats
    description: Endpoints for managing chats
  - name: Messages
    description: Endpoints for sending messages to chats
paths:
  /api/messages/{id}:
    post:
      tags:
        - Messages
      summary: Send a message to a chat
      description: |
        Send a new message to a specific chat. The message will be stored in the database.
        The sender ID is automatically extracted from the JWT Bearer token.
        
        **Important:** The message will be broadcast to all active participants in the chat room via WebSocket 
        using the `NEW_MESSAGE` event. See the **Webby WebSocket Gateway** documentation for details on how 
        to receive real-time message notifications through the WebSocket connection.
        
        ## Integration Flow:
        1. Client sends a message via this REST endpoint
        2. Server extracts sender ID from the JWT token
        3. Server stores the message in the database
        4. Server broadcasts the message to all connected WebSocket clients via the `NEW_MESSAGE` event
        5. Clients receive the message through WebSocket and update the UI in real-time
        
        ## WebSocket Event Reference:
        For information about receiving messages in real-time, refer to the `NEW_MESSAGE` event documentation 
        in the **Webby WebSocket Gateway** service documentation.
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Chat identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chats:
    post:
      tags:
        - Chats
      summary: Create a chat
      description: Create a new chat. If a room ID is provided, the service will reuse an existing chat for that room when available.
      operationId: createChat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/chats/{id}:
    get:
      tags:
        - Chats
      summary: Get chat by ID
      description: Retrieve a chat by UUID.
      operationId: getChatById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Chat identifier
      responses:
        '200':
          description: Chat retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateChatRequest:
      type: object
      properties:
        roomId:
          type: string
          format: uuid
          nullable: true
          description: Optional room UUID to reuse an existing chat
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: Message content text
          example: "Hello, how are you?"
    SendMessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Message sent"
        data:
          type: object
          nullable: true
        errors:
          type: object
          nullable: true
    ChatResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    ChatApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/ChatResponse'
        errors:
          type: object
          additionalProperties:
            type: string
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
