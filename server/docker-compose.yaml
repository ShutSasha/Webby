services:
  api-gateway:
    build: 
      context: .
      dockerfile: Webby.ApiGetaway/Dockerfile
    ports:
      - "5000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - JwtOptions__AccessSecretKey=${JwtAccessSecretKey}
      - JwtOptions__AccessExpiresDuration=${JwtAccessExpiresDuration}
    container_name: webby-api-gateway

  auth-service:
    build: 
      context: .
      dockerfile: Webby.AuthService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppDbContext=${DatabaseConnectionString}
      - SenderData__SenderPassword=${SenderPassword}
      - SenderData__SenderEmail=${SenderEmail}
      - JwtOptions__AccessSecretKey=${JwtAccessSecretKey}
      - JwtOptions__AccessExpiresDuration=${JwtAccessExpiresDuration}
      - AutoMapper__LicenseKey=${AutoMapperLicenseKey}
    container_name: webby-auth-service
  
  notification-service:
    build: 
      context: .
      dockerfile: Webby.NotificationService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppDbContext=${DatabaseConnectionString}
      - JwtOptions__AccessSecretKey=${JwtAccessSecretKey}
      - JwtOptions__AccessExpiresDuration=${JwtAccessExpiresDuration}
      - GrpcClients__UserServiceUrl=${UserGrpcServiceUrl}
    container_name: webby-notification-service
    
  user-service: 
    build: 
      context: .
      dockerfile: Webby.UserService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppDbContext=${DatabaseConnectionString}
      - ConnectionStrings__Redis=${RedisPassword}
      - AwsOptions__AccessKey=${AwsAccessKey}
      - AwsOptions__SecretKey=${AwsSecretKey}
      - AwsOptions__BucketName=${AwsBucketName}
      - AwsOptions__Region=${AwsRegion}
      - PaymentOptions__PaymentPublicKey=${StripePublishableKey}
      - PaymentOptions__PaymentSecretKey=${StripeSecretKey}
      - PaymentOptions__PaymentWebhookKey=${StripeWebhookKey}
      - PaymentOptions__SuccessUrl=${PaymentSuccessUrl}
      - PaymentOptions__CancelUrl=${PaymentCancelUrl}
      - AutoMapper__LicenseKey=${AutoMapperLicenseKey}
      - GrpcClients__VideoServiceUrl=${VideoGrpcServiceUrl}
      - GrpcClients__NotificationServiceUrl=${NotificationGrpcServiceUrl}
      - GrpcClients__AchievementServiceUrl=${AchievementGrpcServiceUrl}
    container_name: webby-user-service

  video-service:
    build: 
      context: .
      dockerfile: Webby.VideoService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppDbContext=${DatabaseConnectionString}
      - ConnectionStrings__Redis=${RedisDbConnectionString}
      - AwsOptions__AccessKey=${AwsAccessKey}
      - AwsOptions__SecretKey=${AwsSecretKey}
      - AwsOptions__BucketName=${AwsBucketName}
      - AwsOptions__Region=${AwsRegion}
      - ExternalServices__YoutubeOptions__ApiKey=${YouTubeApiKey}
      - ExternalServices__TwitchOptions__ClientId=${TwitchIdClient}
      - ExternalServices__TwitchOptions__ClientSecret=${TwitchSecretKey}
      - ExternalServices__TwitchOptions__ThumbnailWidth=1280
      - ExternalServices__TwitchOptions__ThumbnailHeight=720
      - GrpcClients__UserServiceUrl=${UserGrpcServiceUrl}
    container_name: webby-video-service

  achievement-service:
    build:
      context: . 
      dockerfile:  Webby.AchievementService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__AppDbContext=${DatabaseConnectionString}
      - ConnectionStrings__Redis=${RedisDbConnectionString}
      - AwsOptions__AccessKey=${AwsAccessKey}
      - AwsOptions__SecretKey=${AwsSecretKey}
      - AwsOptions__BucketName=${AwsBucketName}
      - AwsOptions__Region=${AwsRegion}
    container_name: webby-achievement-service

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    container_name: webby-redis
    environment:
      - REDIS_PASSWORD=${RedisPassword}
    command: redis-server --requirepass ${RedisPassword}

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${ServerUrl}
        - NEXT_PUBLIC_SIGNALR_URL=${SignalRUrl}
    container_name: webby-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - AUTH_TRUST_HOST=true
      - NEXT_PUBLIC_API_URL=${ServerUrl}
      - NEXT_PUBLIC_SIGNALR_URL=${SignalRUrl}
      - AUTH_SECRET=${WebAuthSecret}
      - AUTH_GOOGLE_ID=${WebAuthGoogleId}
      - AUTH_GOOGLE_SECRET=${WebGoogleAuthSecret}
    restart: unless-stopped

  chat-service:
    build:
      context: .
      dockerfile: Webby.ChatService/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${RedisPassword}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8081
      - GRPC_PORT=50051
      - GRPC_ROOM_SERVICE_ADDRESS=room-service:50054
    depends_on:
      - redis
    container_name: webby-chat-service

  room-service:
    build:
      context: .
      dockerfile: Webby.RoomService/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - AWS_ACCESS_KEY=${AwsAccessKey}
      - AWS_SECRET_KEY=${AwsSecretKey}
      - AWS_BUCKET=${AwsBucketName}
      - AWS_REGION=${AwsRegion}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8080
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50054
      - GRPC_MEDIA_SERVICE_ADDRESS=video-service:5005
      - GRPC_CHAT_SERVICE_ADDRESS=chat-service:50051
      - GRPC_CATEGORY_SERVICE_ADDRESS=room-category-service:50052
      - GRPC_QUEUE_SERVICE_ADDRESS=room-queue-service:50053
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${RedisPassword}
    depends_on:
      - redis
    container_name: webby-room-service

  room-category-service:
    build:
      context: .
      dockerfile: Webby.RoomCategoryService/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8082
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50052
    container_name: webby-room-category-service

  room-queue-service:
    build:
      context: .
      dockerfile: Webby.RoomQueueService/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8083
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50053
      - GRPC_MEDIA_SERVICE_ADDRESS=video-service:5005
      - GRPC_CHAT_SERVICE_ADDRESS=chat-service:50051
      - GRPC_ROOM_SERVICE_ADDRESS=room-service:50053
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${RedisPassword}
    depends_on:
      - redis
    container_name: webby-room-queue-service

  votes-service:
    build:
      context: .
      dockerfile: Webby.VotesService/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8084
      - GRPC_ROOM_SERVICE_ADDRESS=room-service:50054
      - GRPC_QUEUE_SERVICE_ADDRESS=room-queue-service:50053
    container_name: webby-votes-service

  ws-gateway:
    build:
      context: .
      dockerfile: Webby.WsGateway/Dockerfile
    environment:
      - CONNECTION_STRING=${DatabaseConnectionString}
      - JWT_SECRET=${JwtAccessSecretKey}
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8090
      - TOKEN_TTL=5m
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${RedisPassword}
    depends_on:
      - redis
    container_name: webby-ws-gateway

volumes:
  redis-data: