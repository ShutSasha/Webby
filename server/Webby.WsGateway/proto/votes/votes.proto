syntax = "proto3";

package votes;

option go_package = "webby-wsgateway/internal/grpc/votespb";

service VotesGrpcService {
  rpc CastVote(CastVoteRequest) returns (CastVoteResponse);
}

message CastVoteRequest {
  string room_id = 1;
  string user_id = 2;
  string vote_id = 3;
  string choice_id = 4;
}

message CastVoteResponse {}
