syntax = "proto3";

package vote;

option go_package = "webby/vote-service/internal/grpc/votepb";

service VoteGrpcService {
  rpc GetActiveVotes(GetActiveVotesRequest) returns (GetActiveVotesResponse);
}

message GetActiveVotesRequest {
  string roomId = 1;
}

message VoteInfo {
  string id = 1;
  string roomId = 2;
  string type = 3;
  string voteText = 4;
  int32 durationSeconds = 5;
  int32 totalVotes = 6;
}

message GetActiveVotesResponse {
  repeated VoteInfo votes = 1;
}
