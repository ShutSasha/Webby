syntax = "proto3";

package member;

option go_package = "webby-vote-service/internal/grpc/memberpb";

service MemberGrpcService {
  rpc MemberExists(MemberExistsRequest) returns (MemberExistsResponse);
}

message MemberExistsRequest {
  string roomId = 1;
  string userId = 2;
}

message MemberExistsResponse {
  bool exists = 1;
}
